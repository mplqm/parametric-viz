<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adenylate Kinase AR Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; overflow: hidden; font-family: monospace; color: #ccc; }
  canvas { display: block; }

  /* ── loader ──────────────────────────────────────────────────────────────── */
  #loader {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: #111; color: #333; font-size: 12px; letter-spacing: .12em; z-index: 99;
  }
  #loader .sub { font-size: 9px; color: #222; }

  /* ── desktop panel ───────────────────────────────────────────────────────── */
  #panel {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    width: 310px; background: rgba(0,0,0,.72);
    border: 1px solid #2a2a2a; border-radius: 6px; padding: 14px;
  }
  #panel h1 { font-size: 10px; letter-spacing: .18em; color: #555; text-transform: uppercase; margin-bottom: 12px; }
  .lbl { font-size: 9px; letter-spacing: .12em; color: #444; text-transform: uppercase; margin-top: 10px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  select { width: 100%; background: #1a1a1a; color: #bbb; border: 1px solid #2e2e2e; border-radius: 3px; padding: 5px 6px; font-family: monospace; font-size: 10px; cursor: pointer; }
  select option { background: #111; }
  input[type=range] { width: 100%; accent-color: #3366cc; cursor: pointer; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; background: #1a1a1a; color: #999; border: 1px solid #2e2e2e; border-radius: 3px; padding: 6px 4px; font-family: monospace; font-size: 10px; cursor: pointer; }
  button:hover { background: #222; color: #ccc; }
  #speed-sel { flex: 0 0 auto; width: auto; }
  #info { margin-top: 12px; font-size: 9px; color: #3a3a3a; line-height: 1.7; }
  #info .hi { color: #555; }

  /* ── AR hint (shown only during AR session) ──────────────────────────────── */
  #ar-hint {
    display: none;
    margin-top: 10px; padding: 6px 0;
    border-top: 1px solid #2a2a2a;
    font-size: 10px; color: #88aaff; text-align: center; letter-spacing: .06em;
  }
  body.ar-active #ar-hint { display: block; }

  /* ── panel repositions to bottom-centre in AR (DOM overlay) ─────────────── */
  body.ar-active #panel {
    top: auto; bottom: 80px;
    left: 50%; transform: translateX(-50%);
    width: 290px;
  }

  /* ── compat note ─────────────────────────────────────────────────────────── */
  #compat { margin-top: 10px; font-size: 8px; color: #252525; line-height: 1.7; }

  /* ── AR entry button (Three.js ARButton appends this) ────────────────────── */
  #ARButton {
    position: fixed !important;
    bottom: 20px !important; left: 50% !important;
    transform: translateX(-50%) !important;
  }

  /* ── iOS AR Quick Look button ─────────────────────────────────────────────── */
  #ios-ar-row { display: none; margin-top: 10px; }

  /* ── USDZ debug overlay ───────────────────────────────────────────────────── */
  #usdz-debug {
    display: none; position: fixed; top: 12px; left: 12px; z-index: 999;
    background: rgba(0,0,0,.85); color: #fff; font-family: monospace;
    font-size: 12px; line-height: 1.8; padding: 10px 14px; border-radius: 5px;
    border: 1px solid #444; pointer-events: none;
  }
</style>
</head>
<body>

<div id="usdz-debug"></div>

<div style="position:fixed;top:0;left:0;z-index:9999;background:#000;color:#fff;font-family:monospace;font-size:14px;padding:6px 10px;">page loaded</div>

<div id="loader">
  <span>LOADING</span>
  <span class="sub">python3 serve_https.py  ·  then open https://localhost:8443</span>
</div>

<div id="panel" style="display:none">
  <h1>Adenylate Kinase</h1>

  <div class="lbl">Transition</div>
  <select id="sel-transition"></select>

  <div class="lbl">Frame <span id="frame-num">0 / 59</span></div>
  <input type="range" id="slider" min="0" max="59" value="0">

  <div class="row">
    <button id="btn-play">&#9654; Play</button>
    <button id="btn-reset">&#8617; Reset</button>
    <select id="speed-sel">
      <option value="6">&#189;&#215;</option>
      <option value="12" selected>1&#215;</option>
      <option value="24">2&#215;</option>
      <option value="48">4&#215;</option>
    </select>
  </div>

  <div id="ios-ar-row">
    <button id="ios-ar-btn" style="width:100%">&#9657; View in AR (Quick Look)</button>
    <button id="ios-ar-test" style="width:100%;margin-top:6px">AR Test</button>
  </div>

  <div id="ar-hint">&#9679; Point camera at a flat surface</div>
  <div id="info"></div>

  <div id="compat">
    AR: iOS 16+ Safari &nbsp;·&nbsp; Android Chrome 81+
    &nbsp;·&nbsp; Desktop: standard 3D viewer
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE           from 'three';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';
import { ARButton }         from 'three/addons/webxr/ARButton.js';
import { XREstimatedLight } from 'three/addons/webxr/XREstimatedLight.js';
import { USDZExporter }        from 'three/addons/exporters/USDZExporter.js';
import { mergeGeometries }     from 'three/addons/utils/BufferGeometryUtils.js';

// ── constants ─────────────────────────────────────────────────────────────────
// Adenylate kinase CA trace spans ~80 Å.  Scale so it appears 10 cm in AR.
const AR_SCALE     = 0.001;         // ~7 cm diameter at 1 m placement (Three.js units = Å, XR units = m)
const AR_MAX_ATOMS = 214;           // performance cap for 60 fps on mobile
const DIST2_BREAK  = 4.5 * 4.5;    // Å² — max Cα–Cα distance before chain break

// ── renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// ── scene + camera + controls ─────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 2000);
camera.position.set(0, 0, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ── desktop lighting ──────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
const sunLight     = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(1, 2, 3);
scene.add(ambientLight, sunLight);

// ── protein group — all protein objects live here for AR placement/scaling ────
const proteinGroup = new THREE.Group();
scene.add(proteinGroup);

// ── reticle — ring shown on detected surface before placement ─────────────────
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ── shared geometry + materials ───────────────────────────────────────────────
const SPHERE_GEO = new THREE.SphereGeometry(0.3, 8, 6);
const MAT_PHONG  = new THREE.MeshPhongMaterial();          // desktop: lit
const MAT_BASIC  = new THREE.MeshBasicMaterial();          // AR: no lighting calc
const LINE_MAT   = new THREE.LineBasicMaterial({ vertexColors: true });

function rainbowColor(i, n) {
  return new THREE.Color().setHSL((i / Math.max(n - 1, 1)) * 0.75, 1.0, 0.55);
}

// ── scene state ───────────────────────────────────────────────────────────────
let sphereMesh = null;
let backbone   = null;
let currentT   = null;
let segA       = [];   // LOCAL index of segment start
let segB       = [];   // LOCAL index of segment end
let _srcIdx    = [];   // LOCAL index → original frame index

const _dummy = new THREE.Object3D();

function clearScene() {
  if (sphereMesh) { proteinGroup.remove(sphereMesh); sphereMesh = null; }
  if (backbone)   { proteinGroup.remove(backbone); backbone.geometry.dispose(); backbone = null; }
  segA = []; segB = []; _srcIdx = [];
}

function buildScene(t) {
  clearScene();
  currentT = t;
  const Nfull = t.n_residues;
  const f0    = t.frames[0];

  // Precompute backbone break positions from frame 0 geometry + sequence gaps
  const breaks = new Set();
  for (let i = 1; i < Nfull; i++) {
    if (t.res_seq[i] - t.res_seq[i - 1] !== 1) { breaks.add(i); continue; }
    const a = f0[i - 1], b = f0[i];
    const dx = b[0]-a[0], dy = b[1]-a[1], dz = b[2]-a[2];
    if (dx*dx + dy*dy + dz*dz > DIST2_BREAK) breaks.add(i);
  }

  // Atom indices to render: subsample evenly if in AR and too many atoms
  const subsample = arMode && Nfull > AR_MAX_ATOMS;
  _srcIdx = subsample
    ? Array.from({ length: AR_MAX_ATOMS }, (_, k) =>
        Math.round(k * (Nfull - 1) / (AR_MAX_ATOMS - 1)))
    : Array.from({ length: Nfull }, (_, i) => i);
  const N = _srcIdx.length;

  // Rainbow colours by local index (N-term → C-term gradient)
  const colors = _srcIdx.map((_, k) => rainbowColor(k, N));

  // ── instanced CA spheres ─────────────────────────────────────────────────
  const mat    = arMode ? MAT_BASIC : MAT_PHONG;
  const iColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
  colors.forEach((c, k) => iColor.setXYZ(k, c.r, c.g, c.b));
  sphereMesh = new THREE.InstancedMesh(SPHERE_GEO, mat, N);
  sphereMesh.instanceColor = iColor;
  sphereMesh.instanceColor.needsUpdate = true;
  proteinGroup.add(sphereMesh);

  // ── backbone segment pairs ────────────────────────────────────────────────
  segA = []; segB = [];
  if (!subsample) {
    // Full resolution: consecutive original pairs skipping breaks
    for (let i = 1; i < Nfull; i++) {
      if (!breaks.has(i)) { segA.push(i - 1); segB.push(i); }
    }
  } else {
    // Subsampled: connect consecutive local pairs, skip if any break lies between
    for (let k = 1; k < N; k++) {
      const origA = _srcIdx[k - 1], origB = _srcIdx[k];
      let hasBrk = false;
      for (let m = origA + 1; m <= origB; m++) {
        if (breaks.has(m)) { hasBrk = true; break; }
      }
      if (!hasBrk) { segA.push(k - 1); segB.push(k); }
    }
  }

  const nSegs  = segA.length;
  const posArr = new Float32Array(nSegs * 6);
  const colArr = new Float32Array(nSegs * 6);
  for (let s = 0; s < nSegs; s++) {
    const ca = colors[segA[s]], cb = colors[segB[s]];
    colArr[s*6]   = ca.r; colArr[s*6+1] = ca.g; colArr[s*6+2] = ca.b;
    colArr[s*6+3] = cb.r; colArr[s*6+4] = cb.g; colArr[s*6+5] = cb.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
  backbone = new THREE.LineSegments(geo, LINE_MAT);
  proteinGroup.add(backbone);
}

function displayFrame(idx) {
  if (!currentT || !sphereMesh) return;
  const frame = currentT.frames[idx];
  const N     = _srcIdx.length;
  const nSegs = segA.length;

  for (let k = 0; k < N; k++) {
    _dummy.position.fromArray(frame[_srcIdx[k]]);
    _dummy.updateMatrix();
    sphereMesh.setMatrixAt(k, _dummy.matrix);
  }
  sphereMesh.instanceMatrix.needsUpdate = true;

  const pos = backbone.geometry.attributes.position.array;
  for (let s = 0; s < nSegs; s++) {
    const a = frame[_srcIdx[segA[s]]], b = frame[_srcIdx[segB[s]]];
    pos[s*6]   = a[0]; pos[s*6+1] = a[1]; pos[s*6+2] = a[2];
    pos[s*6+3] = b[0]; pos[s*6+4] = b[1]; pos[s*6+5] = b[2];
  }
  backbone.geometry.attributes.position.needsUpdate = true;
}

function fitCamera(frame) {
  const box = new THREE.Box3();
  frame.forEach(p => box.expandByPoint(new THREE.Vector3(p[0], p[1], p[2])));
  const size = box.getSize(new THREE.Vector3());
  const dist = (Math.max(size.x, size.y, size.z) / 2) / Math.tan(camera.fov * Math.PI / 360) * 1.3;
  controls.target.set(0, 0, 0);
  camera.position.set(0, 0, 0).addScaledVector(new THREE.Vector3(0.3, 0.3, 1).normalize(), dist);
  controls.update();
}

// ── WebXR AR ──────────────────────────────────────────────────────────────────
let arMode         = false;
let arPlaced       = false;
let hitTestSource  = null;
let xrLight        = null;
let arProteinScale = AR_SCALE;

renderer.xr.addEventListener('sessionstart', async () => {
  arMode         = true;
  arPlaced       = false;
  arProteinScale = AR_SCALE;
  controls.enabled   = false;
  scene.background   = null;            // transparent — show camera feed

  proteinGroup.scale.setScalar(arProteinScale);
  proteinGroup.position.set(0, 0, 0);
  proteinGroup.rotation.set(0, 0, 0);
  proteinGroup.visible = false;         // hidden until placed
  document.body.classList.add('ar-active');
  setHint('&#9679; Point camera at a flat surface and tap to place');

  // Hit test source
  if (hitTestSource) { hitTestSource.cancel(); hitTestSource = null; }
  try {
    const session   = renderer.xr.getSession();
    const viewerRef = await session.requestReferenceSpace('viewer');
    hitTestSource   = await session.requestHitTestSource({ space: viewerRef });
  } catch (e) { console.warn('Hit test not available:', e.message); }

  // XR light estimation (optional — falls back to desktop lights if unavailable)
  try {
    xrLight = new XREstimatedLight(renderer);
    xrLight.addEventListener('estimationstart', () => {
      scene.add(xrLight);
      ambientLight.visible = false;
      sunLight.visible     = false;
    });
    xrLight.addEventListener('estimationend', () => {
      scene.remove(xrLight);
      ambientLight.visible = true;
      sunLight.visible     = true;
    });
  } catch (e) {}

  renderer.xr.getSession().addEventListener('select', onARSelect);

  // Rebuild with AR subsampling + MeshBasicMaterial
  if (currentT) buildScene(currentT);
});

renderer.xr.addEventListener('sessionend', () => {
  if (hitTestSource) { hitTestSource.cancel(); hitTestSource = null; }
  if (xrLight)       { scene.remove(xrLight); xrLight = null; }
  arMode             = false;
  arPlaced           = false;
  reticle.visible    = false;
  ambientLight.visible = true;
  sunLight.visible     = true;
  controls.enabled     = true;
  scene.background     = new THREE.Color(0x111111);
  proteinGroup.scale.setScalar(1);
  proteinGroup.position.set(0, 0, 0);
  proteinGroup.rotation.set(0, 0, 0);
  proteinGroup.visible = true;
  document.body.classList.remove('ar-active');
  setHint('');
  // Rebuild at full quality with Phong material
  if (currentT) buildScene(currentT);
});

// First tap: place protein on detected surface
// Subsequent taps: toggle play/pause
function onARSelect() {
  if (!arPlaced) {
    if (!reticle.visible) return;
    // Position group at surface with slight upward offset so protein sits on top
    const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
    pos.y += 40 * arProteinScale;    // lift ~40 Å (half-height) above surface
    proteinGroup.position.copy(pos);
    proteinGroup.visible = true;
    arPlaced             = true;
    reticle.visible      = false;
    setHint('Pinch: scale &nbsp;·&nbsp; Two-finger: rotate &nbsp;·&nbsp; Tap: play/pause');
    if (currentT) { setFrame(0); }
  } else {
    togglePlay();
  }
}

function setHint(html) {
  document.getElementById('ar-hint').innerHTML = html;
}

// ── Pinch-to-scale + two-finger rotate via touch events ───────────────────────
// These fire on both the canvas and any DOM overlay elements
let _t0 = null, _t1 = null, _lastPinchDist = null, _lastPinchAngle = null;

function touchStart(e) {
  if (e.touches[0]) _t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.touches[1]) _t1 = { x: e.touches[1].clientX, y: e.touches[1].clientY };
  if (e.touches.length < 2) { _lastPinchDist = null; _lastPinchAngle = null; }
}
function touchMove(e) {
  if (!arMode || !arPlaced || e.touches.length < 2) return;
  _t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  _t1 = { x: e.touches[1].clientX, y: e.touches[1].clientY };
  const dx    = _t1.x - _t0.x, dy = _t1.y - _t0.y;
  const dist  = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);
  if (_lastPinchDist !== null) {
    arProteinScale = Math.max(2e-4, Math.min(8e-3, arProteinScale * dist / _lastPinchDist));
    proteinGroup.scale.setScalar(arProteinScale);
  }
  if (_lastPinchAngle !== null) {
    proteinGroup.rotation.y += angle - _lastPinchAngle;
  }
  _lastPinchDist  = dist;
  _lastPinchAngle = angle;
}
function touchEnd(e) {
  if (e.touches.length < 2) { _t1 = null; _lastPinchDist = null; _lastPinchAngle = null; }
  if (e.touches.length < 1)   _t0 = null;
}
document.addEventListener('touchstart', touchStart, { passive: true });
document.addEventListener('touchmove',  touchMove,  { passive: true });
document.addEventListener('touchend',   touchEnd,   { passive: true });

// ── AR button — appended only when immersive-ar is supported ──────────────────
if ('xr' in navigator) {
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    if (!supported) return;
    const btn = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'light-estimation'],
      domOverlay:       { root: document.body },
    });
    btn.id = 'ARButton';
    document.body.appendChild(btn);
  }).catch(() => {});
}

// ── iOS AR Quick Look ─────────────────────────────────────────────────────────
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

if (isIOS) {
  document.getElementById('ios-ar-row').style.display = 'block';

  document.getElementById('ios-ar-btn').addEventListener('click', async () => {
    const btn = document.getElementById('ios-ar-btn');
    btn.textContent = 'Preparing…';
    btn.disabled = true;
    try {
      const dbg = document.getElementById('usdz-debug');
      dbg.style.display = 'block';
      dbg.innerHTML =
        `children: ${proteinGroup.children.length}<br>` +
        `types: ${proteinGroup.children.map(c => c.type).join(', ')}<br>` +
        `InstancedMesh: ${proteinGroup.children.some(c => c.isInstancedMesh)}<br>` +
        `byteLength: …`;
      setTimeout(() => { dbg.style.display = 'none'; }, 10000);
      // Build merged geometry from InstancedMesh — one cloned+transformed geo per instance
      const instMesh = proteinGroup.children.find(c => c.isInstancedMesh);
      const geos = [];
      const col   = new THREE.Color();
      const mat4  = new THREE.Matrix4();
      for (let i = 0; i < instMesh.count; i++) {
        instMesh.getMatrixAt(i, mat4);
        instMesh.getColorAt(i, col);
        const g = instMesh.geometry.clone();
        g.applyMatrix4(mat4);
        // Write per-vertex colour
        const vCount = g.attributes.position.count;
        const cArr   = new Float32Array(vCount * 3);
        for (let v = 0; v < vCount; v++) { cArr[v*3] = col.r; cArr[v*3+1] = col.g; cArr[v*3+2] = col.b; }
        g.setAttribute('color', new THREE.BufferAttribute(cArr, 3));
        geos.push(g);
      }
      const merged  = mergeGeometries(geos, false);
      geos.forEach(g => g.dispose());

      merged.computeBoundingBox();
      const bbSize   = merged.boundingBox.getSize(new THREE.Vector3());
      const bbCentre = merged.boundingBox.getCenter(new THREE.Vector3());
      merged.translate(-bbCentre.x, -bbCentre.y, -bbCentre.z);
      merged.computeBoundingBox();
      const bbCentreAfter = merged.boundingBox.getCenter(new THREE.Vector3());
      const bbMsg    = `bbox size: ${bbSize.x.toFixed(2)}, ${bbSize.y.toFixed(2)}, ${bbSize.z.toFixed(2)} Å<br>` +
                       `bbox centre before: ${bbCentre.x.toFixed(2)}, ${bbCentre.y.toFixed(2)}, ${bbCentre.z.toFixed(2)}<br>` +
                       `bbox centre after: ${bbCentreAfter.x.toFixed(2)}, ${bbCentreAfter.y.toFixed(2)}, ${bbCentreAfter.z.toFixed(2)}<br>` +
                       `AR_SCALE: ${AR_SCALE}`;
      console.log('[USDZ geo]', bbMsg.replace(/<br>/g, ' | '));
      document.getElementById('usdz-debug').innerHTML += '<br>' + bbMsg;

      const mat     = new THREE.MeshStandardMaterial({ vertexColors: true });
      const mesh    = new THREE.Mesh(merged, mat);
      mesh.scale.setScalar(AR_SCALE);
      const exportGrp = new THREE.Group();
      exportGrp.add(mesh);

      const usdzData = await new USDZExporter().parseAsync(exportGrp);

      merged.dispose(); mat.dispose(); exportGrp.remove(mesh);
      dbg.innerHTML = dbg.innerHTML.replace('byteLength: …', `byteLength: ${usdzData.byteLength} — Mesh (merged)`);

      const bytes  = new Uint8Array(usdzData.slice(0, 16));
      const header = Array.from(bytes).map(b => String.fromCharCode(b)).join('');
      const hex    = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
      dbg.innerHTML += `<br>byteLength: ${usdzData.byteLength}<br>header: ${header}<br>hex: ${hex}`;
    } catch (e) {
      console.error('USDZ export failed:', e);
      document.getElementById('usdz-debug').innerHTML += `<br>ERROR: ${e.message}`;
    } finally {
      btn.textContent = '▷ View in AR (Quick Look)';
      btn.disabled = false;
    }
  });

  document.getElementById('ios-ar-test').addEventListener('click', () => {
    const a = document.createElement('a');
    a.setAttribute('rel', 'ar');
    a.appendChild(document.createElement('img'));
    a.href = 'https://developer.apple.com/augmented-reality/quick-look/models/drummertoy/toy_drummer.usdz';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 30000);
  });
}

// ── playback ──────────────────────────────────────────────────────────────────
let currentFrame = 0;
let isPlaying    = false;
let lastTs       = 0;
let direction    = 1;

function fps() { return parseInt(document.getElementById('speed-sel').value); }

function setFrame(idx) {
  currentFrame = Math.max(0, Math.min(idx, currentT.frames.length - 1));
  displayFrame(currentFrame);
  document.getElementById('slider').value = currentFrame;
  document.getElementById('frame-num').textContent =
    `${currentFrame} / ${currentT.frames.length - 1}`;
}

function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('btn-play').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  lastTs = 0;
}

// ── render loop (setAnimationLoop required for WebXR) ─────────────────────────
renderer.setAnimationLoop(function (ts, frame) {
  // Update reticle from hit test in AR pre-placement phase
  if (frame && hitTestSource && !arPlaced) {
    const ref  = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitTestSource);
    if (hits.length > 0) {
      reticle.visible = true;
      reticle.matrix.fromArray(hits[0].getPose(ref).transform.matrix);
    } else {
      reticle.visible = false;
    }
  }

  // Playback advance
  if (isPlaying && currentT) {
    if (ts - lastTs >= 1000 / fps()) {
      const total = currentT.frames.length;
      let next = currentFrame + direction;
      if (next >= total - 1) { next = total - 1; direction = -1; }
      else if (next <= 0)    { next = 0;          direction =  1; }
      setFrame(next);
      lastTs = ts;
    }
  }

  if (!frame) controls.update();   // orbit controls only in non-XR mode
  renderer.render(scene, camera);
});

// ── UI wiring ─────────────────────────────────────────────────────────────────
document.getElementById('slider').addEventListener('input', e => {
  if (isPlaying) togglePlay();
  setFrame(parseInt(e.target.value));
});
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-reset').addEventListener('click', () => {
  if (isPlaying) togglePlay();
  setFrame(0);
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── data loading ──────────────────────────────────────────────────────────────
const _cache = {};
async function loadTransition(meta) {
  let t = _cache[meta.id];
  if (!t) {
    document.getElementById('info').textContent = `Loading ${meta.id}…`;
    const r = await fetch(`transitions/${meta.id}.json`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    t = await r.json();
    _cache[meta.id] = t;
  }
  buildScene(t);
  setFrame(0);
  if (!arMode) fitCamera(t.frames[0]);
  document.getElementById('slider').max = t.frames.length - 1;
  document.getElementById('info').innerHTML =
    `<span class="hi">C${t.from_cluster} → C${t.to_cluster}</span><br>` +
    `From: ${t.from_members.join(', ')}<br>` +
    `To:&nbsp;&nbsp; ${t.to_members.join(', ')}<br>` +
    `${t.n_residues} C&alpha; &nbsp;·&nbsp; res ${t.res_seq[0]}–${t.res_seq.at(-1)}`;
}

// ── bootstrap ─────────────────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('transitions/index.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const index = await r.json();

    const sel = document.getElementById('sel-transition');
    index.transitions.forEach((t, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.text  = `C${t.from_cluster}→C${t.to_cluster}  [${t.from_members.join('+')}]→[${t.to_members.join('+')}]  (${t.n_residues} Cα)`;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', e =>
      loadTransition(index.transitions[parseInt(e.target.value)])
    );

    document.getElementById('loader').style.display = 'none';
    document.getElementById('panel').style.display  = 'block';
    await loadTransition(index.transitions[0]);

  } catch (err) {
    document.getElementById('loader').innerHTML =
      `<span style="color:#662222">Failed: ${err.message}</span>` +
      `<span class="sub">Serve HTTPS:  python3 serve_https.py</span>`;
  }
})();
</script>
