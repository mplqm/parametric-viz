<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adenylate Kinase Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; overflow: hidden; font-family: monospace; color: #ccc; }
  canvas { display: block; }

  #panel {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    width: 310px;
    background: rgba(0,0,0,0.72);
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 14px;
  }
  #panel h1 { font-size: 10px; letter-spacing: 0.18em; color: #555; text-transform: uppercase; margin-bottom: 12px; }
  .lbl { font-size: 9px; letter-spacing: 0.12em; color: #444; text-transform: uppercase; margin-top: 10px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  select {
    width: 100%; background: #1a1a1a; color: #bbb;
    border: 1px solid #2e2e2e; border-radius: 3px;
    padding: 5px 6px; font-family: monospace; font-size: 10px; cursor: pointer;
  }
  select option { background: #111; }
  input[type=range] {
    width: 100%; accent-color: #3366cc; cursor: pointer;
    height: 3px; margin-top: 2px;
  }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button {
    flex: 1; background: #1a1a1a; color: #999;
    border: 1px solid #2e2e2e; border-radius: 3px;
    padding: 6px 4px; font-family: monospace; font-size: 10px; cursor: pointer;
  }
  button:hover { background: #222; color: #ccc; }
  #speed-sel { flex: 0 0 auto; width: auto; }
  #info { margin-top: 12px; font-size: 9px; color: #3a3a3a; line-height: 1.7; }
  #info .hi { color: #555; }

  #loader {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    background: #111; color: #333; font-size: 12px; letter-spacing: 0.12em; z-index: 99;
  }
  #loader .sub { font-size: 9px; color: #222; letter-spacing: 0.1em; }
</style>
</head>
<body>

<div id="loader">
  <span>LOADING</span>
  <span class="sub">python3 -m http.server</span>
</div>

<div id="panel" style="display:none">
  <h1>Adenylate Kinase</h1>

  <div class="lbl">Transition</div>
  <select id="sel-transition"></select>

  <div class="lbl">Frame <span id="frame-num">0 / 59</span></div>
  <input type="range" id="slider" min="0" max="59" value="0">

  <div class="row">
    <button id="btn-play">&#9654; Play</button>
    <button id="btn-reset">&#8617; Reset</button>
    <select id="speed-sel" title="Playback speed">
      <option value="6">&#189;&#215;</option>
      <option value="12" selected>1&#215;</option>
      <option value="24">2&#215;</option>
      <option value="48">4&#215;</option>
    </select>
  </div>

  <div id="info"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE        from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// ── camera ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 0, 120);

// ── controls ──────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ── lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(1, 2, 3);
scene.add(sun);

// ── shared geometry / materials ───────────────────────────────────────────────
const SPHERE_GEO = new THREE.SphereGeometry(0.3, 8, 6);
const SPHERE_MAT = new THREE.MeshPhongMaterial();
const LINE_MAT   = new THREE.LineBasicMaterial({ vertexColors: true });

function rainbowColor(i, n) {
  return new THREE.Color().setHSL((i / Math.max(n - 1, 1)) * 0.75, 1.0, 0.55);
}

// ── scene state ───────────────────────────────────────────────────────────────
let sphereMesh = null;
let backbone   = null;
let currentT   = null;
let segA       = [];   // residue index of segment start
let segB       = [];   // residue index of segment end

const _dummy = new THREE.Object3D();

function clearScene() {
  if (sphereMesh) { scene.remove(sphereMesh); sphereMesh = null; }
  if (backbone)   { scene.remove(backbone); backbone.geometry.dispose(); backbone = null; }
  segA = []; segB = [];
}

function buildScene(t) {
  clearScene();
  currentT = t;
  const N  = t.n_residues;
  const f0 = t.frames[0];

  // rainbow colours by residue index (constant across frames)
  const colors = Array.from({ length: N }, (_, i) => rainbowColor(i, N));

  // ── instanced CA spheres ─────────────────────────────────────────────────
  const iColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
  colors.forEach((c, i) => iColor.setXYZ(i, c.r, c.g, c.b));
  sphereMesh = new THREE.InstancedMesh(SPHERE_GEO, SPHERE_MAT, N);
  sphereMesh.instanceColor = iColor;
  sphereMesh.instanceColor.needsUpdate = true;
  scene.add(sphereMesh);

  // ── backbone segment pairs ────────────────────────────────────────────────
  const DIST2 = 4.5 * 4.5;
  for (let i = 1; i < N; i++) {
    if (t.res_seq[i] - t.res_seq[i - 1] !== 1) continue;
    const a = f0[i - 1], b = f0[i];
    const dx = b[0]-a[0], dy = b[1]-a[1], dz = b[2]-a[2];
    if (dx*dx + dy*dy + dz*dz > DIST2) continue;
    segA.push(i - 1);
    segB.push(i);
  }
  const nSegs = segA.length;

  const posArr = new Float32Array(nSegs * 6);
  const colArr = new Float32Array(nSegs * 6);
  for (let s = 0; s < nSegs; s++) {
    const ca = colors[segA[s]], cb = colors[segB[s]];
    colArr[s*6]   = ca.r; colArr[s*6+1] = ca.g; colArr[s*6+2] = ca.b;
    colArr[s*6+3] = cb.r; colArr[s*6+4] = cb.g; colArr[s*6+5] = cb.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
  backbone = new THREE.LineSegments(geo, LINE_MAT);
  scene.add(backbone);
}

function displayFrame(idx) {
  const frame = currentT.frames[idx];
  const nSegs = segA.length;

  for (let i = 0; i < frame.length; i++) {
    _dummy.position.fromArray(frame[i]);
    _dummy.updateMatrix();
    sphereMesh.setMatrixAt(i, _dummy.matrix);
  }
  sphereMesh.instanceMatrix.needsUpdate = true;

  const pos = backbone.geometry.attributes.position.array;
  for (let s = 0; s < nSegs; s++) {
    const a = frame[segA[s]], b = frame[segB[s]];
    pos[s*6]   = a[0]; pos[s*6+1] = a[1]; pos[s*6+2] = a[2];
    pos[s*6+3] = b[0]; pos[s*6+4] = b[1]; pos[s*6+5] = b[2];
  }
  backbone.geometry.attributes.position.needsUpdate = true;
}

function fitCamera(frame) {
  const box = new THREE.Box3();
  frame.forEach(p => box.expandByPoint(new THREE.Vector3(p[0], p[1], p[2])));
  const centre = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist   = (maxDim / 2) / Math.tan(camera.fov * Math.PI / 360) * 1.3;
  controls.target.copy(centre);
  camera.position.copy(centre).addScaledVector(
    new THREE.Vector3(0.3, 0.3, 1).normalize(), dist
  );
  controls.update();
}

// ── playback ──────────────────────────────────────────────────────────────────
let currentFrame = 0;
let isPlaying    = false;
let lastTs       = 0;

function fps() { return parseInt(document.getElementById('speed-sel').value); }

function setFrame(idx) {
  currentFrame = Math.max(0, Math.min(idx, currentT.frames.length - 1));
  displayFrame(currentFrame);
  document.getElementById('slider').value = currentFrame;
  document.getElementById('frame-num').textContent =
    `${currentFrame} / ${currentT.frames.length - 1}`;
}

// ── render loop ───────────────────────────────────────────────────────────────
function animate(ts) {
  requestAnimationFrame(animate);
  if (isPlaying && currentT) {
    if (ts - lastTs >= 1000 / fps()) {
      setFrame((currentFrame + 1) % currentT.frames.length);
      lastTs = ts;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}

// ── data loading ──────────────────────────────────────────────────────────────
const _cache = {};

async function loadTransition(meta) {
  let t = _cache[meta.id];
  if (!t) {
    document.getElementById('info').innerHTML =
      `<span class="hi">Loading ${meta.id}…</span>`;
    const r = await fetch(`transitions/${meta.id}.json`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    t = await r.json();
    _cache[meta.id] = t;
  }
  buildScene(t);
  setFrame(0);
  fitCamera(t.frames[0]);
  document.getElementById('slider').max = t.frames.length - 1;
  document.getElementById('info').innerHTML =
    `<span class="hi">C${t.from_cluster} → C${t.to_cluster}</span><br>` +
    `From: ${t.from_members.join(', ')}<br>` +
    `To:   ${t.to_members.join(', ')}<br>` +
    `${t.n_residues} Cα &nbsp;·&nbsp; res ${t.res_seq[0]}–${t.res_seq.at(-1)}`;
}

// ── UI wiring ─────────────────────────────────────────────────────────────────
document.getElementById('slider').addEventListener('input', e => {
  if (isPlaying) { isPlaying = false; document.getElementById('btn-play').textContent = '▶ Play'; }
  setFrame(parseInt(e.target.value));
});

document.getElementById('btn-play').addEventListener('click', () => {
  isPlaying = !isPlaying;
  document.getElementById('btn-play').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  lastTs = 0;
});

document.getElementById('btn-reset').addEventListener('click', () => {
  isPlaying = false;
  document.getElementById('btn-play').textContent = '▶ Play';
  setFrame(0);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── bootstrap ─────────────────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('transitions/index.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const index = await r.json();

    const sel = document.getElementById('sel-transition');
    index.transitions.forEach((t, i) => {
      const opt  = document.createElement('option');
      opt.value  = i;
      opt.text   = `C${t.from_cluster}→C${t.to_cluster}  [${t.from_members.join('+')}]→[${t.to_members.join('+')}]  (${t.n_residues} Cα)`;
      sel.appendChild(opt);
    });

    sel.addEventListener('change', e =>
      loadTransition(index.transitions[parseInt(e.target.value)])
    );

    document.getElementById('loader').style.display = 'none';
    document.getElementById('panel').style.display  = 'block';
    requestAnimationFrame(animate);
    loadTransition(index.transitions[0]);

  } catch (err) {
    const el = document.getElementById('loader');
    el.innerHTML =
      `<span style="color:#662222">Failed: ${err.message}</span>` +
      `<span class="sub">Run:  python3 -m http.server  then open  http://localhost:8000</span>`;
  }
})();
</script>
</body>
</html>
